          nullable: true
        categoryHandle:
          type: string
        categoryName:
          type: string
        imageUrls:
          type: array
          items:
            type: string
        offers:
          type: array
          items:
            $ref: "#/components/schemas/PeerOffer"
          description: Sellable peer offers, cheapest first (offerId tie-break).

    CategoryNode:
