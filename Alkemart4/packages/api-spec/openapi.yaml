        - onHand
        - reserved
        - currency
        - active
      properties:
        id:
          type: string
        sellerId:
          type: string
        productId:
          type: string
        variantId:
          type: string
        pricePesewas:
          $ref: "#/components/schemas/PesewasString"
        onHand:
          type: integer
          minimum: 0
        reserved:
          type: integer
          minimum: 0
        currency:
          $ref: "#/components/schemas/Currency"
        active:
          type: boolean

    VendorProduct:
      type: object
      additionalProperties: false
      required: [product, variant, offer]
      properties:
        product:
          type: object
          additionalProperties: false
          required:
