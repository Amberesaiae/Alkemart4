          minimum: 0
        sku:
          type: string
          nullable: true
          maxLength: 64
        variantTitle:
          type: string
          nullable: true
          maxLength: 120
        imageUrl:
          type: string
          nullable: true
          maxLength: 2048
          description: Vendor-supplied http(s) image URL (uploads land on Workers later).

    PatchVendorProductRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          nullable: true
          maxLength: 5000
        primaryCategoryId:
          type: string
        pricePesewas:
          $ref: "#/components/schemas/PesewasString"
        onHand:
          type: integer
          minimum: 0
        active:
          type: boolean
        sku:
          type: string
          nullable: true
          maxLength: 64
        variantTitle:
          type: string
          nullable: true
          maxLength: 120
        imageUrl:
          type: string
          nullable: true
          maxLength: 2048
          description: Vendor-supplied http(s) image URL (uploads land on Workers later).

    VendorOffer:
      type: object
      additionalProperties: false
