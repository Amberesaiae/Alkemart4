    ProductCard:
      type: object
      additionalProperties: false
      required:
        - productId
        - title
        - categoryHandle
        - categoryName
        - imageUrl
        - fromPricePesewas
        - bestOfferId
        - offerCount
        - sellerId
        - sellerHandle
        - sellerName
        - availableQty
        - createdAt
        - currency
      properties:
        productId:
          type: string
        title:
          type: string
        categoryHandle:
          type: string
        categoryName:
          type: string
        imageUrl:
          type: string
          nullable: true
        fromPricePesewas:
          $ref: "#/components/schemas/PesewasString"
        bestOfferId:
          type: string
          description: Offer id of the cheapest sellable offer (offerId tie-break).
        offerCount:
          type: integer
          minimum: 1
          description: Count of sellable peer offers for this product (this seller only on shop pages).
        sellerId:
          type: string
          description: Seller behind the best offer.
        sellerHandle:
          type: string
        sellerName:
          type: string
        availableQty:
          type: integer
          minimum: 1
          description: Sellable units on the best offer (on_hand − reserved).
        createdAt:
          type: string
          nullable: true
          description: ISO product creation timestamp; null for rows predating the column.
        currency:
          $ref: "#/components/schemas/Currency"

    PeerOffer:
      type: object
      additionalProperties: false
      required:
        - offerId
        - sellerId
        - sellerHandle
        - sellerName
        - pricePesewas
        - currency
        - available
        - deliveryFeePesewas
      properties:
        offerId:
          type: string
        sellerId:
          type: string
        sellerHandle:
          type: string
        sellerName:
          type: string
        pricePesewas:
          $ref: "#/components/schemas/PesewasString"
        currency:
          $ref: "#/components/schemas/Currency"
        available:
