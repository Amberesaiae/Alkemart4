openapi: 3.0.3
info:
  title: Alkemart Store API
  version: 0.6.0
  description: |
    Multivendor Ghana catalog + Plan 2 identity/seller contract.
    Product is canonical content; Offer is the sellable unit.
    Money fields are integer pesewas encoded as decimal strings.
    No major-unit `price` fields.
    Seller payouts use Paystack transfer recipients (`recipientCode`) only —
    never Stripe, Flutterwave, or a generic multi-PSP interface.
    Checkout charge/initialize is documented under /store/checkout.
servers:
  - url: /
    description: API origin (Workers / local wrangler)
tags:
  - name: fulfillment
    description: Per-seller ship/deliver and Paystack payouts
  - name: checkout
    description: Multi-seller cart and Paystack checkout
  - name: catalog
    description: Product-centric PLP and Ghana category nav
  - name: products
    description: PDP with peer offers
  - name: sellers
    description: Public seller shops
  - name: merchandising
    description: Published homepage sections (Studio compat reader)
  - name: reviews
    description: Verified-purchase buyer reviews
  - name: orders
    description: Buyer order groups (signed-in and guest lookup)
  - name: search
    description: Alias-aware product search with server-counted facets
  - name: admin-aliases
    description: Search-vocabulary governance (reviewed synonyms/redirects)
  - name: admin-search
    description: Projection freshness and zero-result queue
  - name: store-auth
    description: Buyer register/login
  - name: vendor-auth
    description: Seller register/login and session
  - name: vendor-onboarding
    description: Ghana readiness and Paystack MoMo transfer recipient setup
  - name: vendor-products
    description: Seller-scoped product and offer writes
  - name: admin-auth
    description: Admin login and session
  - name: admin-sellers
    description: Seller lifecycle and commission
  - name: admin-products
    description: Product moderation (propose → published/rejected)
  - name: admin-taxonomy
    description: Taxonomy lifecycle (propose → active → deprecated with replacement)
  - name: admin-attributes
    description: Typed attribute definitions and category profiles
  - name: admin-matches
    description: Product-match review queue (reviewed merges only)

paths:
  /store/categories:
    get:
      operationId: getCategories
      tags: [catalog]
      summary: Ghana category nav tree (active, nav-visible nodes only)
      description: |
        Proposed and deprecated nodes are pruned; deprecated slugs resolve
        via GET /store/categories/resolve. Display names fall back to
        canonical names, slugs to handles.
      responses:
        "200":
          description: Category nav tree
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryListResponse"

  /store/categories/resolve:
    get:
      operationId: resolveCategory
      tags: [catalog]
      summary: Follow a category slug through deprecation redirects
      parameters:
        - name: slug
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Terminal active node id + slug
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /store/catalog:
    get:
      operationId: getCatalog
      tags: [catalog]
      summary: Product-centric catalog (one card per product)
      description: |
        Aggregates sellable offers into one ProductCard per product.
        `fromPricePesewas` is the cheapest sellable offer; `offerCount` is the
        number of sellable peer offers. No product-level price.
      parameters:
        - name: category
          in: query
          required: false
          description: Category handle; includes descendants.
          schema:
            type: string
        - name: q
          in: query
          required: false
          description: Case-insensitive title/description substring filter.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: sort
          in: query
          required: false
          description: |
            Card ordering. Default stays title-asc (stable across pages);
            `newest` sorts by product creation time.
          schema:
            type: string
            enum: [newest, price_asc, price_desc]
      responses:
        "200":
          description: Paginated product cards
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogListResponse"

  /store/catalog/popular:
    get:
      operationId: getPopularProducts
      tags: [catalog]
      summary: Popularity shelves from real orders only
      description: |
        window=7d ranks by units sold in the last week (Trending); no window
        ranks all time (Most ordered). Products with no orders never appear —
        an empty shelf renders empty rather than degrading into an arbitrary
        catalogue slice dressed up as popular.
      parameters:
        - name: window
          in: query
          required: false
          schema:
            type: string
            enum: [7d, 30d]
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 48
            default: 12
      responses:
        "200":
          description: Ranked product cards
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ProductCard"
                  total:
                    type: integer

  /store/homepage:
    get:
      operationId: getStoreHomepage
      tags: [merchandising]
      summary: Published homepage sections
      description: |
        Serves the published Studio snapshot (content_pages compat reader).
        Cacheable: max-age=60, stale-while-revalidate=300.
      responses:
        "200":
          description: Homepage key + published sections

  /store/search:
    get:
      operationId: searchProducts
      tags: [search]
      summary: Alias-aware product search (sellable offers only)
      description: |
        Approved synonyms rewrite the query (provenance in appliedAlias);
        redirect aliases return a canonical target. Facets are
        definition-backed with server counts. Unknown filter codes are 400.
        Zero/low-result queries are logged for the quality queue.
      parameters:
        - name: q
          in: query
          required: false
          schema: { type: string }
        - name: category
          in: query
          required: false
          description: Category id, slug, or handle (includes descendants).
          schema: { type: string }
        - name: filter
          in: query
          required: false
          description: Repeatable typed-attribute filter `code:v1,v2`.
          schema: { type: string }
        - name: priceMin
          in: query
          required: false
          description: Integer pesewas floor on best price.
          schema: { type: string }
        - name: priceMax
          in: query
          required: false
          schema: { type: string }
        - name: condition
          in: query
          required: false
          schema: { type: string }
        - name: sort
          in: query
          required: false
          schema: { type: string, enum: [newest, price_asc, price_desc] }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Cards + facets + alias provenance + recovery suggestions
        "400":
          $ref: "#/components/responses/BadRequest"

  /store/catalog/facets:
    get:
      operationId: getCatalogFacets
      tags: [search]
      summary: Definition-backed facets with server counts
      parameters:
        - name: category
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Price bounds, availability, conditions, attribute counts

  /store/products/{id}:
    get:
      operationId: getProduct
      tags: [products]
      summary: Product detail with peer offers
      description: |
        Returns product content plus all sellable peer offers, cheapest first.
        `offers` may be empty when the product exists but none are sellable.
        Never includes a product-level price field.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Product detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductDetail"
        "404":
          description: Product not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /store/sellers:
    get:
      operationId: listSellerShops
      tags: [sellers]
      summary: Open-shop cards for the Stores index
      description: |
        Everything a buyer needs to choose a shop without opening it.
        Aggregates are batched (one review roll-up, one order roll-up, one
        featured-picks read). Ratings are omitted — never zeroed — when a shop
        is unreviewed. Paused shops are marked, not hidden.
      responses:
        "200":
          description: Shop cards (also aliased as items for legacy clients)

  /store/sellers/{handle}:
    get:
      operationId: getSellerShop
      tags: [sellers]
      summary: Seller shop (that seller's sellable offers only)
      parameters:
        - name: handle
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Seller shop
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SellerShopResponse"
        "404":
          description: Seller not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /store/auth/register:
    post:
      operationId: registerBuyer
      tags: [store-auth]
      summary: Register buyer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        "201":
          description: Buyer session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"

  /store/auth/login:
    post:
      operationId: loginBuyer
      tags: [store-auth]
      summary: Login buyer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        "200":
          description: Buyer session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /vendor/auth/register:
    post:
      operationId: registerVendor
      tags: [vendor-auth]
      summary: Register vendor (pending seller)
      description: |
        Creates user (`seller_member`), seller (`pending_approval`), owner
        membership, and a JWT that includes `sellerId`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VendorRegisterRequest"
      responses:
        "201":
          description: Vendor session with sellerId
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"

  /vendor/auth/login:
    post:
      operationId: loginVendor
      tags: [vendor-auth]
      summary: Login vendor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        "200":
          description: Vendor session with sellerId
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /vendor/me:
    get:
      operationId: getVendorMe
      tags: [vendor-auth]
      summary: Current seller session claims
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Session claims
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionClaims"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /vendor/onboarding/status:
    get:
      operationId: getVendorOnboardingStatus
      tags: [vendor-onboarding]
      summary: Ghana seller readiness
      description: |
        Returns readiness gates. `missing` may include `name`, `region`, and
        `recipient_code` (Paystack transfer recipient code).
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Readiness
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SellerReadiness"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /vendor/onboarding/ghana-setup:
    post:
      operationId: postVendorGhanaSetup
      tags: [vendor-onboarding]
      summary: Ghana MoMo payout setup via Paystack transfer recipient
      description: |
        Creates a Paystack transfer recipient for MoMo and stores `recipientCode`
        on the seller. Requires `PAYSTACK_SECRET_KEY` (503 if missing).
        Does not charge; checkout is Plan 3.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GhanaSetupRequest"
      responses:
        "200":
          description: Updated readiness (typically ready after successful recipient)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SellerReadiness"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          description: Paystack transfer recipient call failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: PAYSTACK_SECRET_KEY is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /vendor/products:
    get:
      operationId: listVendorProducts
      tags: [vendor-products]
      summary: List products owned by the authenticated seller
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Seller product list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VendorProductListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createVendorProduct
      tags: [vendor-products]
      summary: Create product + default variant + offer (proposed)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVendorProductRequest"
      responses:
        "201":
          description: Created vendor product bundle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VendorProduct"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /vendor/products/{id}:
    patch:
      operationId: updateVendorProduct
      tags: [vendor-products]
      summary: Patch owned product/offer (404 if not owned)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchVendorProductRequest"
      responses:
        "200":
          description: Updated vendor product bundle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VendorProduct"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /vendor/products/{id}/propose:
    post:
      operationId: proposeVendorProduct
      tags: [vendor-products]
      summary: Propose owned product for moderation
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated vendor product bundle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VendorProduct"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /vendor/products/{id}/identity:
    patch:
      operationId: updateProductIdentity
      tags: [vendor-products]
      summary: Seller enrichment of product identity (never promotes confidence)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                brand: { type: string, nullable: true, maxLength: 120 }
                model: { type: string, nullable: true, maxLength: 120 }
                gtin: { type: string, nullable: true, maxLength: 32 }
                mpn: { type: string, nullable: true, maxLength: 64 }
                manufacturer: { type: string, nullable: true, maxLength: 120 }
                productType: { type: string, nullable: true, maxLength: 80 }
      responses:
        "200":
          description: Identity with comparison eligibility
        "404":
          $ref: "#/components/responses/NotFound"

  /vendor/products/{id}/attributes:
    get:
      operationId: getProductAttributeValues
      tags: [vendor-products]
      summary: Owned product values + all definitions
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Values and definitions
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: setProductAttributeValues
      tags: [vendor-products]
      summary: Write typed values (definitions govern, 400 on invalid)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              minItems: 1
              maxItems: 100
              items: { type: object }
      responses:
        "200":
          description: Stored values
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/auth/login:
    post:
      operationId: loginAdmin
      tags: [admin-auth]
      summary: Login admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        "200":
          description: Admin session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /admin/me:
    get:
      operationId: getAdminMe
      tags: [admin-auth]
      summary: Current admin session claims
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Session claims
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionClaims"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/sellers/{id}/approve:
    post:
      operationId: approveSeller
      tags: [admin-sellers]
      summary: Approve seller (status → open)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/SellerId"
      responses:
        "200":
          description: Seller updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSellerResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/sellers/{id}/suspend:
    post:
      operationId: suspendSeller
      tags: [admin-sellers]
      summary: Suspend seller (status → suspended)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/SellerId"
      responses:
        "200":
          description: Seller updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSellerResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/sellers/{id}/unsuspend:
    post:
      operationId: unsuspendSeller
      tags: [admin-sellers]
      summary: Unsuspend seller (status → open)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/SellerId"
      responses:
        "200":
          description: Seller updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSellerResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/sellers/{id}/terminate:
    post:
      operationId: terminateSeller
      tags: [admin-sellers]
      summary: Terminate seller (status → terminated)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/SellerId"
      responses:
        "200":
          description: Seller updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSellerResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/sellers/{id}/commission:
    post:
      operationId: setSellerCommission
      tags: [admin-sellers]
      summary: Set seller commission basis points
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/SellerId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommissionRequest"
      responses:
        "200":
          description: Seller updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSellerResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/products/{id}:
    get:
      operationId: getAdminProductDetail
      tags: [admin-products]
      summary: Full product detail for review (options + combinations)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProductId"
      responses:
        "200":
          description: Product detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VendorProduct"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/products/{id}/approve:
    post:
      operationId: approveProduct
      tags: [admin-products]
      summary: Approve product (status → published)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProductId"
      responses:
        "200":
          description: Product updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminProductResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/products/{id}/reject:
    post:
      operationId: rejectProduct
      tags: [admin-products]
      summary: Reject product (status → rejected)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProductId"
      responses:
        "200":
          description: Product updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminProductResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/products/{id}/request-changes:
    post:
      operationId: requestProductChanges
      tags: [admin-products]
      summary: Request changes (stays proposed)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProductId"
      responses:
        "200":
          description: Product updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminProductResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/products/{id}/identity/promote:
    post:
      operationId: promoteProductIdentity
      tags: [admin-products]
      summary: Reviewed identity promotion (matched/identified)
      description: The reviewer is the calling admin; unreviewed promotion is rejected by the domain.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProductId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confidence]
              properties:
                confidence: { type: string, enum: [matched, identified] }
      responses:
        "200":
          description: Identity with comparison eligibility
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/taxonomy:
    get:
      operationId: listTaxonomyNodes
      tags: [admin-taxonomy]
      summary: Full governed taxonomy (all statuses)
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Taxonomy nodes
    post:
      operationId: createTaxonomyNode
      tags: [admin-taxonomy]
      summary: Propose a category node
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name]
              properties:
                code: { type: string }
                name: { type: string }
                displayName: { type: string, nullable: true }
                slug: { type: string, nullable: true }
                handle: { type: string, nullable: true }
                parentId: { type: string, nullable: true }
                isBrowseable: { type: boolean }
                isAssignable: { type: boolean }
                isNavVisible: { type: boolean }
                attributeProfileId: { type: string, nullable: true }
                sortOrder: { type: integer }
      responses:
        "201":
          description: Proposed node
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"

  /admin/taxonomy/{id}:
    patch:
      operationId: updateTaxonomyNode
      tags: [admin-taxonomy]
      summary: Edit node or activate it (proposed → active)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200":
          description: Updated node
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/taxonomy/{id}/deprecate:
    post:
      operationId: deprecateTaxonomyNode
      tags: [admin-taxonomy]
      summary: Deprecate with a live replacement (never delete)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [replacementId]
              properties:
                replacementId: { type: string }
      responses:
        "200":
          description: Deprecated node
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/attributes/definitions:
    get:
      operationId: listAttributeDefinitions
      tags: [admin-attributes]
      summary: Typed attribute definitions
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Definitions
    post:
      operationId: createAttributeDefinition
      tags: [admin-attributes]
      summary: Govern a new attribute definition
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, label, type]
              properties:
                code: { type: string }
                label: { type: string }
                type: { type: string, enum: [text, number, boolean, option, multi_option] }
      responses:
        "201":
          description: Definition created
        "409":
          $ref: "#/components/responses/Conflict"

  /admin/attributes/profiles:
    get:
      operationId: listAttributeProfiles
      tags: [admin-attributes]
      summary: Category attribute profiles
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Profiles
    post:
      operationId: createAttributeProfile
      tags: [admin-attributes]
      summary: Bind definitions into a category profile
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, definitions]
              properties:
                name: { type: string }
                categoryId: { type: string, nullable: true }
      responses:
        "201":
          description: Profile created

  /admin/matches:
    get:
      operationId: listMatchCandidates
      tags: [admin-matches]
      summary: Match review queue (optional status filter)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [proposed, confirmed, rejected] }
      responses:
        "200":
          description: Candidates

  /admin/matches/{id}/review:
    post:
      operationId: reviewMatchCandidate
      tags: [admin-matches]
      summary: Confirm (promotes both sides to matched) or reject
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [confirmed, rejected] }
      responses:
        "200":
          description: Reviewed candidate
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/aliases:
    get:
      operationId: listSearchAliases
      tags: [admin-aliases]
      summary: Alias governance queue (optional status filter)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [proposed, approved, rejected] }
      responses:
        "200":
          description: Aliases
    post:
      operationId: proposeSearchAlias
      tags: [admin-aliases]
      summary: Propose a synonym or redirect
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [term, target, type]
              properties:
                term: { type: string }
                target: { type: string }
                type: { type: string, enum: [synonym, redirect] }
      responses:
        "201":
          description: Proposed alias
        "409":
          $ref: "#/components/responses/Conflict"

  /admin/aliases/{id}/review:
    post:
      operationId: reviewSearchAlias
      tags: [admin-aliases]
      summary: Approve (goes live) or reject a term
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [approved, rejected] }
      responses:
        "200":
          description: Reviewed alias
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/search/status:
    get:
      operationId: getSearchStatus
      tags: [admin-search]
      summary: Outbox depth, alias counts, zero-result sample
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Search operations status

  /admin/search/zero-result:
    get:
      operationId: listZeroResultQueries
      tags: [admin-search]
      summary: Zero-result query queue for taxonomy/alias review
      security: [{ bearerAuth: [] }]
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: Recent zero-result queries

  /store/cart:
    post:
      operationId: createCart
      tags: [checkout]
      summary: Create empty cart
      responses:
        "201":
          description: Cart created
          content:
            application/json:
              schema:
                type: object
                required: [cartId]
                properties:
                  cartId: { type: string }

  /store/cart/{id}/items:
    post:
      operationId: addCartItem
      tags: [checkout]
      summary: Add offer line (offerId required)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [offerId, qty]
              properties:
                offerId: { type: string }
                qty: { type: integer, minimum: 1 }
      responses:
        "201":
          description: Line added
        "400":
          $ref: "#/components/responses/BadRequest"

  /store/cart/{id}:
    get:
      operationId: getCart
      tags: [checkout]
      summary: Cart lines + multi-seller quote
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Cart with quote (pesewas strings)
        "404":
          $ref: "#/components/responses/NotFound"

  /store/checkout:
    post:
      operationId: createCheckout
      tags: [checkout]
      summary: COD / Paystack MoMo / Paystack card checkout
      description: |
        COD completes OrderGroup immediately. MoMo charges via Paystack and soft-holds stock.
        Card returns Paystack authorizationUrl. Missing PAYSTACK_SECRET_KEY → 503 for momo/card.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cartId, method, buyerEmail]
              properties:
                cartId: { type: string }
                method: { type: string, enum: [cod, momo, card] }
                buyerEmail: { type: string, format: email }
                callbackUrl: { type: string, format: uri }
                momo:
                  type: object
                  properties:
                    provider: { type: string, enum: [mtn, vodafone, airteltigo] }
                    phone: { type: string }
      responses:
        "200":
          description: Checkout started or completed
        "503":
          description: Paystack key missing

  /store/checkout/status:
    get:
      operationId: getCheckoutStatus
      tags: [checkout]
      summary: Poll payment intent state by cart
      description: |
        MoMo/card intents re-verify with Paystack when pending, so a poll
        that arrives before the webhook can still complete. Statuses:
        completed | failed | payment_pending.
      parameters:
        - name: cartId
          in: query
          required: false
          schema: { type: string }
        - name: cart_id
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Intent state (one of completed, failed, payment_pending)
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /store/reviews:
    post:
      operationId: createStoreReview
      tags: [reviews]
      summary: Verified-purchase review (delivered orders only)
      description: |
        Order must be delivered and the email must match the order group.
        One review per order (409 on duplicate). New reviews start pending
        for admin moderation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderId, buyerEmail, rating, body]
              properties:
                orderId: { type: string }
                buyerEmail: { type: string, format: email }
                rating: { type: integer, minimum: 1, maximum: 5 }
                title: { type: string, maxLength: 120, nullable: true }
                body: { type: string, maxLength: 2000 }
      responses:
        "201":
          description: Review created (pending moderation)
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /store/orders:
    get:
      operationId: listBuyerOrders
      tags: [orders]
      summary: Buyer order groups for the signed-in user
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Order groups with per-seller orders
        "401":
          $ref: "#/components/responses/Unauthorized"

  /store/orders/lookup:
    post:
      operationId: lookupOrderGroup
      tags: [orders]
      summary: Guest order lookup by order/group id + email
      description: Same 404 whether the order is missing or the email mismatches (anti-enumeration).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderId, email]
              properties:
                orderId: { type: string }
                email: { type: string, format: email }
      responses:
        "200":
          description: Order group with per-seller orders
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /store/orders/{id}:
    get:
      operationId: getOrderGroup
      tags: [orders]
      summary: Order group by group id or order id
      description: Bearer JWT must match the group buyer email; otherwise 404 (guest flow uses POST /store/orders/lookup).
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Order group with per-seller orders
        "404":
          $ref: "#/components/responses/NotFound"

  /hooks/paystack:
    post:
      operationId: paystackWebhook
      tags: [checkout]
      summary: Paystack webhook (HMAC SHA512)
      parameters:
        - name: x-paystack-signature
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200":
          description: Accepted
        "401":
          description: Invalid signature


  /vendor/orders:
    get:
      operationId: listVendorOrders
      tags: [fulfillment]
      summary: List seller-scoped orders
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Seller orders
        "403":
          $ref: "#/components/responses/Forbidden"

  /vendor/orders/{id}/ship:
    post:
      operationId: shipVendorOrder
      tags: [fulfillment]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Order shipped
        "404":
          $ref: "#/components/responses/NotFound"

  /vendor/orders/{id}/deliver:
    post:
      operationId: deliverVendorOrder
      tags: [fulfillment]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Order delivered
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/payouts:
    post:
      operationId: createAdminPayout
      tags: [fulfillment]
      summary: Paystack transfer for delivered unpaid orders
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sellerId]
              properties:
                sellerId: { type: string }
      responses:
        "200":
          description: Payout created
        "503":
          description: Paystack key missing


components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: HS256 session JWT from store/vendor/admin auth.

  parameters:
    SellerId:
      name: id
      in: path
      required: true
      schema:
        type: string
    ProductId:
      name: id
      in: path
      required: true
      schema:
        type: string

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Missing or invalid credentials/token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Authenticated but wrong actor
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found (or not owned)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Unique constraint conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    Currency:
      type: string
      enum: [ghs]
      description: ISO-ish market currency; Ghana v1 is always ghs.

    PesewasString:
      type: string
      pattern: "^[0-9]+$"
      description: Integer pesewas as a decimal string (JSON-safe bigint). Never major units.

    UserRole:
      type: string
      enum: [buyer, seller_member, admin]

    SellerStatus:
      type: string
      enum: [pending_approval, open, suspended, terminated]

    ProductStatus:
      type: string
      enum: [draft, proposed, published, rejected]

    PaystackMomoProvider:
      type: string
      enum: [mtn, vodafone, airteltigo]
      description: Ghana MoMo provider for Paystack transfer recipient bank code.

    Credentials:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8

    VendorRegisterRequest:
      type: object
      additionalProperties: false
      required: [email, password, sellerName, sellerHandle]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        sellerName:
          type: string
          minLength: 1
          maxLength: 80
        sellerHandle:
          type: string
          minLength: 2
          maxLength: 40
          description: Lowercase kebab handle; normalized server-side.

    AuthUser:
      type: object
      additionalProperties: false
      required: [id, email, role]
      properties:
        id:
          type: string
        email:
          type: string
        role:
          $ref: "#/components/schemas/UserRole"
        sellerId:
          type: string
          description: Present for seller_member sessions.

    AuthSessionResponse:
      type: object
      additionalProperties: false
      required: [token, user]
      properties:
        token:
          type: string
          description: HS256 JWT (claims include userId, role, optional sellerId).
        user:
          $ref: "#/components/schemas/AuthUser"

    SessionClaims:
      type: object
      additionalProperties: false
      required: [userId, role]
      properties:
        userId:
          type: string
        role:
          $ref: "#/components/schemas/UserRole"
        sellerId:
          type: string

    SellerReadiness:
      type: object
      additionalProperties: false
      required: [ready, missing]
      properties:
        ready:
          type: boolean
        missing:
          type: array
          items:
            type: string
          description: Gate keys such as name, region, recipient_code.

    GhanaSetupRequest:
      type: object
      additionalProperties: false
      required: [displayName, region, deliveryFeePesewas, momo]
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 80
        region:
          type: string
          description: Ghana region id from @alkemart/shared/ghana (e.g. GH07).
        digitalAddress:
          type: string
          maxLength: 32
        deliveryFeePesewas:
          $ref: "#/components/schemas/PesewasString"
        momo:
          type: object
          additionalProperties: false
          required: [provider, phone, accountName]
          properties:
            provider:
              $ref: "#/components/schemas/PaystackMomoProvider"
            phone:
              type: string
              minLength: 9
              maxLength: 20
              description: MoMo MSISDN used as Paystack account_number.
            accountName:
              type: string
              minLength: 1
              maxLength: 80
              description: Paystack transfer recipient name.

    CreateVendorProductRequest:
      type: object
      additionalProperties: false
      required: [title, primaryCategoryId, pricePesewas, onHand]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          nullable: true
          maxLength: 5000
        primaryCategoryId:
          type: string
        pricePesewas:
          $ref: "#/components/schemas/PesewasString"
        onHand:
          type: integer
          minimum: 0
        sku:
          type: string
          nullable: true
          maxLength: 64
        variantTitle:
          type: string
          nullable: true
          maxLength: 120
        imageUrl:
          type: string
          nullable: true
          maxLength: 2048
          description: Vendor-supplied http(s) image URL (uploads land on Workers later).
        identity:
          type: object
          description: Brand/model enrichment at publish (Level C default; no barcode required).
          properties:
            brand: { type: string, nullable: true, maxLength: 120 }
            model: { type: string, nullable: true, maxLength: 120 }
            gtin: { type: string, nullable: true, maxLength: 32 }
            mpn: { type: string, nullable: true, maxLength: 64 }
            manufacturer: { type: string, nullable: true, maxLength: 120 }
            productType: { type: string, nullable: true, maxLength: 80 }

    PatchVendorProductRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          nullable: true
          maxLength: 5000
        primaryCategoryId:
          type: string
        pricePesewas:
          $ref: "#/components/schemas/PesewasString"
        onHand:
          type: integer
          minimum: 0
        active:
          type: boolean
        sku:
          type: string
          nullable: true
          maxLength: 64
        variantTitle:
          type: string
          nullable: true
          maxLength: 120
        imageUrl:
          type: string
          nullable: true
          maxLength: 2048
          description: Vendor-supplied http(s) image URL (uploads land on Workers later).

    VendorOffer:
      type: object
      additionalProperties: false
      required:
        - id
        - sellerId
        - productId
        - variantId
        - pricePesewas
        - onHand
        - reserved
        - currency
        - active
      properties:
        id:
          type: string
        sellerId:
          type: string
        productId:
          type: string
        variantId:
          type: string
        pricePesewas:
          $ref: "#/components/schemas/PesewasString"
        onHand:
          type: integer
          minimum: 0
        reserved:
          type: integer
          minimum: 0
        currency:
          $ref: "#/components/schemas/Currency"
        active:
          type: boolean

    VendorProduct:
      type: object
      additionalProperties: false
      required: [product, variant, offer]
      properties:
        product:
          type: object
          additionalProperties: false
          required:
            - id
            - title
            - description
            - status
            - primaryCategoryId
            - sellerId
          properties:
            id:
              type: string
            title:
              type: string
            description:
              type: string
              nullable: true
            status:
              $ref: "#/components/schemas/ProductStatus"
            primaryCategoryId:
              type: string
            sellerId:
              type: string
              nullable: true
        variant:
          type: object
          additionalProperties: false
          required: [id, sku, title]
          properties:
            id:
              type: string
            sku:
              type: string
              nullable: true
            title:
              type: string
              nullable: true
        offer:
          $ref: "#/components/schemas/VendorOffer"
        options:
          type: array
          items:
            $ref: "#/components/schemas/VendorProductOption"
          description: Option types + values (empty for legacy products).
        variants:
          type: array
          items:
            $ref: "#/components/schemas/VendorProductCombo"
          description: Every combination with its offer.

    VendorProductOption:
      type: object
      additionalProperties: false
      required: [id, name, values]
      properties:
        id: { type: string }
        name: { type: string }
        values:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, value, imageUrl]
            properties:
              id: { type: string }
              value: { type: string }
              imageUrl: { type: string, nullable: true }

    VendorProductCombo:
      type: object
      additionalProperties: false
      required: [variant, offer, options]
      properties:
        variant:
          type: object
          additionalProperties: false
          required: [id, sku, title]
          properties:
            id: { type: string }
            sku: { type: string, nullable: true }
            title: { type: string, nullable: true }
        offer:
          $ref: "#/components/schemas/VendorOffer"
        options:
          type: object
          additionalProperties:
            type: string
          description: Option name to value for this combination.

    VendorProductListResponse:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/VendorProduct"

    CommissionRequest:
      type: object
      additionalProperties: false
      required: [commissionBps]
      properties:
        commissionBps:
          type: integer
          minimum: 0
          maximum: 10000

    AdminSeller:
      type: object
      additionalProperties: false
      required: [id, handle, name, status, commissionBps]
      properties:
        id:
          type: string
        handle:
          type: string
        name:
          type: string
        status:
          $ref: "#/components/schemas/SellerStatus"
        commissionBps:
          type: integer
          minimum: 0
          maximum: 10000

    AdminSellerResponse:
      type: object
      additionalProperties: false
      required: [seller]
      properties:
        seller:
          $ref: "#/components/schemas/AdminSeller"

    AdminProduct:
      type: object
      additionalProperties: false
      required:
        - id
        - title
        - description
        - status
        - primaryCategoryId
        - sellerId
        - imageUrl
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
          nullable: true
        status:
          $ref: "#/components/schemas/ProductStatus"
        primaryCategoryId:
          type: string
        sellerId:
          type: string
          nullable: true
        imageUrl:
          type: string
          nullable: true

    AdminProductResponse:
      type: object
      additionalProperties: false
      required: [product]
      properties:
        product:
          $ref: "#/components/schemas/AdminProduct"

    ProductCard:
      type: object
      additionalProperties: false
      required:
        - productId
        - title
        - categoryHandle
        - categoryName
        - imageUrl
        - fromPricePesewas
        - bestOfferId
        - offerCount
        - sellerId
        - sellerHandle
        - sellerName
        - availableQty
        - createdAt
        - currency
      properties:
        productId:
          type: string
        title:
          type: string
        categoryHandle:
          type: string
        categoryName:
          type: string
        imageUrl:
          type: string
          nullable: true
        fromPricePesewas:
          $ref: "#/components/schemas/PesewasString"
        bestOfferId:
          type: string
          description: Offer id of the cheapest sellable offer (offerId tie-break).
        offerCount:
          type: integer
          minimum: 1
          description: Count of sellable peer offers for this product (this seller only on shop pages).
        sellerId:
          type: string
          description: Seller behind the best offer.
        sellerHandle:
          type: string
        sellerName:
          type: string
        availableQty:
          type: integer
          minimum: 1
          description: Sellable units on the best offer (on_hand − reserved).
        createdAt:
          type: string
          nullable: true
          description: ISO product creation timestamp; null for rows predating the column.
        currency:
          $ref: "#/components/schemas/Currency"

    PeerOffer:
      type: object
      additionalProperties: false
      required:
        - offerId
        - sellerId
        - sellerHandle
        - sellerName
        - pricePesewas
        - currency
        - available
        - deliveryFeePesewas
      properties:
        offerId:
          type: string
        sellerId:
          type: string
        sellerHandle:
          type: string
        sellerName:
          type: string
        pricePesewas:
          $ref: "#/components/schemas/PesewasString"
        currency:
          $ref: "#/components/schemas/Currency"
        available:
          type: integer
          minimum: 0
          description: onHand minus reserved.
        deliveryFeePesewas:
          $ref: "#/components/schemas/PesewasString"
        options:
          type: object
          additionalProperties:
            type: string
          description: Combination option map (V1 matrix); empty for legacy offers.

    ProductOptionType:
      type: object
      additionalProperties: false
      required:
        - name
        - values
      properties:
        name:
          type: string
        values:
          type: array
          items:
            $ref: "#/components/schemas/ProductOptionValue"

    ProductOptionValue:
      type: object
      additionalProperties: false
      required:
        - value
        - imageUrl
      properties:
        value:
          type: string
        imageUrl:
          type: string
          nullable: true
          description: Swatch photo for visual options.

    ProductCombo:
      type: object
      additionalProperties: false
      required:
        - offerId
        - sellerId
        - options
        - pricePesewas
        - availableQty
        - active
      properties:
        offerId:
          type: string
        sellerId:
          type: string
        options:
          type: object
          additionalProperties:
            type: string
        pricePesewas:
          $ref: "#/components/schemas/PesewasString"
        availableQty:
          type: integer
          description: onHand minus reserved (may be <= 0 for strikethrough display).
        active:
          type: boolean

    ProductReview:
      type: object
      additionalProperties: false
      required:
        - rating
        - title
        - body
        - vendorResponse
        - createdAt
      properties:
        rating:
          type: integer
          minimum: 1
          maximum: 5
        title:
          type: string
          nullable: true
        body:
          type: string
        vendorResponse:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    ProductDetail:
      type: object
      additionalProperties: false
      required:
        - productId
        - title
        - description
        - categoryHandle
        - categoryName
        - imageUrls
        - offers
        - optionTypes
        - combos
        - ratingAvg
        - ratingCount
        - reviews
        - identity
      properties:
        productId:
          type: string
        title:
          type: string
        description:
          type: string
          nullable: true
        categoryHandle:
          type: string
        categoryName:
          type: string
        imageUrls:
          type: array
          items:
            type: string
        offers:
          type: array
          items:
            $ref: "#/components/schemas/PeerOffer"
          description: Sellable peer offers, cheapest first (offerId tie-break).
        optionTypes:
          type: array
          items:
            $ref: "#/components/schemas/ProductOptionType"
          description: Variant option types in display order (V1 matrix).
        combos:
          type: array
          items:
            $ref: "#/components/schemas/ProductCombo"
          description: Every combination incl. unstocked/archived, for honest strikethrough.
        ratingAvg:
          type: number
          nullable: true
          description: Mean of published review ratings.
        ratingCount:
          type: integer
          minimum: 0
        reviews:
          type: array
          items:
            $ref: "#/components/schemas/ProductReview"
          description: Latest published reviews (max 5).
        identity:
          type: object
          required: [identityConfidence, comparisonEligible]
          description: Product identity (ADR-002). UIs hide comparison language unless comparisonEligible.
          properties:
            brand: { type: string, nullable: true }
            model: { type: string, nullable: true }
            manufacturer: { type: string, nullable: true }
            productType: { type: string, nullable: true }
            identityConfidence: { type: string, enum: [identified, matched, seller_specific] }
            comparisonEligible: { type: boolean }

    CategoryNode:
      type: object
      additionalProperties: false
      required:
        - id
        - handle
        - name
        - parentId
        - children
      properties:
        id:
          type: string
        handle:
          type: string
        name:
          type: string
        parentId:
          type: string
          nullable: true
        children:
          type: array
          items:
            $ref: "#/components/schemas/CategoryNode"

    SellerSummary:
      type: object
      additionalProperties: false
      required:
        - id
        - handle
        - name
        - availability
      properties:
        id:
          type: string
        handle:
          type: string
        name:
          type: string
        availability:
          $ref: "#/components/schemas/SellerAvailability"
        description:
          type: string
          nullable: true
        logo:
          type: string
          nullable: true
        banner:
          type: string
          nullable: true
        trust:
          $ref: "#/components/schemas/SellerShopTrust"
          nullable: true
          description: Ratings, sales, profile, announcement, policy, recent reviews. Null when unassemblable.

    SellerShopTrust:
      type: object
      additionalProperties: false
      required:
        - ratingAvg
        - ratingCount
        - salesCount
        - memberSince
        - location
        - tagline
        - phone
        - hours
        - social
        - announcement
        - policy
        - recentReviews
      properties:
        ratingAvg:
          type: number
          nullable: true
        ratingCount:
          type: integer
        salesCount:
          type: integer
        memberSince:
          type: string
          nullable: true
        location:
          type: string
          nullable: true
        tagline:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        hours:
          type: object
          nullable: true
          additionalProperties: false
          required: [days, open, close]
          properties:
            days: { type: string }
            open: { type: string }
            close: { type: string }
        social:
          type: object
          additionalProperties:
            type: string
        announcement:
          type: string
          nullable: true
        policy:
          type: object
          nullable: true
          additionalProperties: false
          properties:
            shipping: { type: string }
            returnsDays: { type: integer }
            warranty: { type: string }
        recentReviews:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [productTitle, rating, title, body, createdAt]
            properties:
              productTitle: { type: string }
              rating: { type: number }
              title: { type: string, nullable: true }
              body: { type: string }
              createdAt: { type: string }

    SellerAvailability:
      type: object
      additionalProperties: false
      required:
        - state
        - pausedUntil
        - note
      properties:
        state:
          type: string
          enum: [open, paused]
        pausedUntil:
          type: string
          nullable: true
        note:
          type: string
          nullable: true

    SellerShopResponse:
      type: object
      additionalProperties: false
      required:
        - seller
        - featuredProductIds
        - items
      properties:
        seller:
          $ref: "#/components/schemas/SellerSummary"
        featuredProductIds:
          type: array
          items:
            type: string
          description: Vendor-curated shelf order (rank ≤ 8).
        items:
          type: array
          items:
            $ref: "#/components/schemas/ProductCard"
          description: Product cards built from this seller's sellable offers only.

    CatalogListResponse:
      type: object
      additionalProperties: false
      required:
        - items
        - total
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ProductCard"
        total:
          type: integer
          minimum: 0

    CategoryListResponse:
      type: object
      additionalProperties: false
      required:
        - categories
      properties:
        categories:
          type: array
          items:
            $ref: "#/components/schemas/CategoryNode"

    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: string
