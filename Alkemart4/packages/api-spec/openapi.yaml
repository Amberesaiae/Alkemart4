            - sellerId
          properties:
            id:
              type: string
            title:
              type: string
            description:
              type: string
              nullable: true
            status:
              $ref: "#/components/schemas/ProductStatus"
            primaryCategoryId:
              type: string
            sellerId:
              type: string
              nullable: true
        variant:
          type: object
          additionalProperties: false
          required: [id, sku, title]
          properties:
            id:
              type: string
            sku:
              type: string
              nullable: true
            title:
              type: string
              nullable: true
        offer:
          $ref: "#/components/schemas/VendorOffer"

    VendorProductListResponse:
      type: object
      additionalProperties: false
