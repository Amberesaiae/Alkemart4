name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run build
        working-directory: apps/backend
      - run: bun run check-types
        working-directory: apps/backend
  unit:
    runs-on: ubuntu-latest
    needs: [validate]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: medusa-test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run test:unit
        working-directory: apps/backend/packages/api
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/medusa-test
          REDIS_URL: redis://localhost:6379
      - run: bun run test
        working-directory: apps/storefront
  integration:
    runs-on: ubuntu-latest
    needs: [validate]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: medusa-test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run test:integration:http
        working-directory: apps/backend/packages/api
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/medusa-test
          REDIS_URL: redis://localhost:6379
  e2e:
    if: vars.RUN_E2E == 'true'
    runs-on: ubuntu-latest
    needs: [unit]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: medusa-e2e
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bunx playwright install chromium
        working-directory: e2e
      - name: Start backend
        run: |
          bun run --cwd apps/backend dev &
          # Wait for API health
          for i in $(seq 1 30); do
            if curl -sf http://localhost:9000/health > /dev/null 2>&1; then
              echo "API healthy after ${i}s"
              break
            fi
            sleep 2
          done
      - name: Start storefront
        run: |
          bun run --cwd apps/storefront dev &
          for i in $(seq 1 20); do
            if curl -sf http://localhost:5175 > /dev/null 2>&1; then
              echo "Storefront ready after ${i}s"
              break
            fi
            sleep 2
          done
      - name: Seed E2E accounts
        run: bun run e2e/scripts/seed-e2e-accounts.ts
        env:
          API_URL: http://localhost:9000
      - run: bun run test
        working-directory: e2e
        env:
          CI: true
          API_URL: http://localhost:9000
          SHOP_URL: http://localhost:5175
          ADMIN_URL: http://localhost:7000
          SELLER_URL: http://localhost:7001
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/medusa-e2e
          REDIS_URL: redis://localhost:6379
