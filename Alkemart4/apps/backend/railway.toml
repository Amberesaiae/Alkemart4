[build]
builder = "railpack"
installCommand = "bun install"
buildCommand = "bun run build"

[provider]
strategy = "nixpacks"

[deploy]
# Runtime runs under Bun (medusa-config.ts uses extensionless relative imports
# like "./src/lib/force-ipv4-dns" which Bun resolves natively, no tsx needed).
# The start script's child spawn uses process.execPath, which is Bun here.
startCommand = "cd packages/api && bun ./scripts/start-with-compression.mjs"
preDeployCommand = "cd packages/api && bun medusa db:migrate"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
resourceLimit = "shared-2x"
# Database rollback strategy:
# 1. Use `railway rollback` to revert the API deployment to the previous version.
# 2. Run `bun medusa db:migrate --down` to revert the last migration if schema changed.
#    List recent migrations: `bun medusa db:migrate --last 5`
# 3. If data was migrated forward, restore from Neon's point-in-time recovery (PITR):
#    Neon dashboard > Branch > Restore from Timestamp.
# 4. Never run irreversible migrations (e.g. DROP COLUMN) during business hours.
#    Use multiple deploy phases: (a) add column, (b) backfill, (c) drop old column.

# Non-secret env vars safe to commit. All secrets go in Railway dashboard.
[env]
NODE_ENV = "production"
PORT = "9000"
# S3 config: set these in Railway dashboard when Tigris/R2 is added.
# DO NOT set FILE_DRIVER=local — the backend will crash on restart (env.ts:99-102).
FILE_DRIVER = "s3"
# S3_REGION, S3_ENDPOINT, S3_BUCKET, S3_ACCESS_KEY_ID, S3_SECRET_ACCESS_KEY,
# S3_FILE_URL → Railway dashboard (Variables tab)
# DATABASE_URL, REDIS_URL, JWT_SECRET, COOKIE_SECRET → Railway dashboard
# PAYSTACK_SECRET_KEY, RESEND_API_KEY → Railway dashboard
# AT_API_KEY, AT_USERNAME → Railway dashboard (Africa's Talking SMS/WhatsApp)
# SENTRY_DSN → Railway dashboard (optional, error tracking)
