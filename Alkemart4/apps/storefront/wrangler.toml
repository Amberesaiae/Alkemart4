# Storefront Worker config
# This file configures Cloudflare Pages / Workers for the alkemart-storefront SPA.
# The storefront is deployed via Vercel (primary) or Cloudflare Pages (alternative).
# The `bucket` points to the Vite build output directory.
name = "alkemart-storefront"
compatibility_date = "2024-01-01"
[site]
bucket = "./dist"
