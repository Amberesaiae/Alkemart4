<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>alkemart — many sellers, one marketplace</title>
    <meta
      name="description"
      content="Compare prices from trusted local sellers, shop independent stores, and pay on delivery, by mobile money or card."
    />
    <meta name="theme-color" content="#ffffff" />
    <meta property="og:site_name" content="alkemart" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta property="og:image" content="/brand/og.png" />
    <link rel="icon" href="/icons/icon-512.png" type="image/png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="stylesheet" href="/brand/loading.css" />
    <style>
      /* Keep sizing separate from the shared mark styles loaded during app startup. */
      html, body { margin: 0; background: #fff; }
      .boot { display: grid; min-height: 100dvh; place-items: center; }
      .boot-mark { width: 44px; height: 44px; }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" role="status" aria-label="Loading alkemart">
        <span class="boot-mark" aria-hidden="true">
          <span class="brand-loading-mark">
          <img class="brand-loading-base" src="/brand/alkemart-mark.png" alt="" />
          <img class="brand-loading-petal brand-loading-petal--coral" src="/brand/alkemart-mark.png" alt="" />
          <img class="brand-loading-petal brand-loading-petal--violet" src="/brand/alkemart-mark.png" alt="" />
          <img class="brand-loading-petal brand-loading-petal--teal" src="/brand/alkemart-mark.png" alt="" />
          <img class="brand-loading-petal brand-loading-petal--blue" src="/brand/alkemart-mark.png" alt="" />
          <img class="brand-loading-petal brand-loading-petal--head" src="/brand/alkemart-mark.png" alt="" />
          </span>
        </span>
      </div>
    </div>
    <noscript>
      <p style="font-family: system-ui; max-width: 36rem; margin: 2rem auto; padding: 0 1rem">
        alkemart needs JavaScript to shop. Enable it and reload.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
