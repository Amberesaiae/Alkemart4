name = "alkemart-api"
main = "src/index.ts"
compatibility_date = "2026-08-28"
compatibility_flags = ["nodejs_compat"]

# Hosted sign-in is served by this Worker on the app hosts themselves, so
# host-only cookies stay first-party and rate limits see the real client IP
# (a Pages Function proxy would arrive from one shared Cloudflare address).
# api.alkemart.com is listed so a deploy never detaches the existing domain.
workers_dev = true
routes = [
  { pattern = "api.alkemart.com", custom_domain = true },
  { pattern = "alkemart.com/store/auth/workos/*", zone_name = "alkemart.com" },
  { pattern = "sell.alkemart.com/vendor/auth/workos/*", zone_name = "alkemart.com" },
]

# Async jobs ride Cloudflare Queues (agnostic plan Phase 2), not cron: per-intent
# delayed expiry messages replace the hourly sweep, and confirm-path producers
# trigger notification dispatch. Zero cron slots consumed, so deploys stay green
# on any plan. Create once (needs API access):
#   wrangler queues create alkemart-jobs-intent-expiry
#   wrangler queues create alkemart-jobs-intent-expiry-dlq
#   wrangler queues create alkemart-jobs-notifications
#   wrangler queues create alkemart-jobs-notifications-dlq
# `scheduled()` is kept as a dormant compat entrypoint (see index.ts); the
# admin fallback POST /admin/migrate/expire-payment-intents remains the
# no-queue backstop.
[[queues.producers]]
binding = "JOBS_INTENT_EXPIRY"
queue = "alkemart-jobs-intent-expiry"

[[queues.producers]]
binding = "JOBS_NOTIFICATIONS"
queue = "alkemart-jobs-notifications"

[[queues.consumers]]
queue = "alkemart-jobs-intent-expiry"
max_batch_size = 100
max_retries = 3
retry_delay = 60
dead_letter_queue = "alkemart-jobs-intent-expiry-dlq"

[[queues.consumers]]
queue = "alkemart-jobs-notifications"
max_batch_size = 100
max_retries = 3
retry_delay = 60
dead_letter_queue = "alkemart-jobs-notifications-dlq"

# Local: `bun run dev:api` → http://127.0.0.1:8787 (see docs/architecture/workers/LOCAL-DEV.md)
# Secrets for local: apps/api/.dev.vars (from .dev.vars.example)
# Production secrets via wrangler secret / dashboard:
#   JWT_SECRET, PAYSTACK_SECRET_KEY
#   ALLOWED_ORIGINS = comma-separated extra CORS origins (custom domains)
#   ENVIRONMENT = development|staging|production
# See docs/ops/cors-and-origins.md and DEPLOYMENT.md

# Non-secret runtime config. ENVIRONMENT is validated by env.ts (zod) and
# defaults to "development" when absent — which is what production was running
# as, because it had never been set. Declared here rather than via
# `wrangler secret put` because it carries nothing sensitive and belongs in
# version control. Secrets (JWT_SECRET, PAYSTACK_SECRET_KEY, AT_*) stay in
# `wrangler secret`.
[vars]
ENVIRONMENT = "production"
STOREFRONT_URL = "https://alkemart.com"
VENDOR_URL = "https://sell.alkemart.com"
WORKOS_STOREFRONT_API_ORIGIN = "https://alkemart.com"
WORKOS_VENDOR_API_ORIGIN = "https://sell.alkemart.com"
# Keep cutover off until production provider, migrations and E2E gates pass.
WORKOS_ENABLED = "0"
# Admin API trusts only Cloudflare Access assertions for this team/audience,
# and only for these identities (keep in step with the Access policy).
ADMIN_ACCESS_TEAM = "https://proud-block-b3f8.cloudflareaccess.com"
ADMIN_ACCESS_AUD = "e841b78f33d66a76e22cf6e82159e78a8f087534e87545af6090110184478982"
ADMIN_ACCESS_EMAILS = "isaiahamber5@gmail.com,akpey.mawuena@gmail.com"
# Sign-up challenge must come from these hosts (secret: TURNSTILE_SECRET_KEY).
TURNSTILE_HOSTNAMES = "alkemart.com,sell.alkemart.com"
# Transactional mail via Resend (alkemart.com verified, eu-west-1). Secret
# RESEND_API_KEY is send-only and scoped to alkemart.com. Replies land in
# support@, which Email Routing forwards to both admins.
EMAIL_FROM = "Alkemart <no-reply@alkemart.com>"
EMAIL_REPLY_TO = "support@alkemart.com"


[[durable_objects.bindings]]
name = "AUTH_RATE_LIMITER"
class_name = "AuthRateLimiter"

[[migrations]]
tag = "v1-auth-rate-limiter"
new_sqlite_classes = ["AuthRateLimiter"]

[dev]
port = 8787
local_protocol = "http"

# Supabase alkemart (eu-west-1) — dual Hyperdrive
# Catalog / cached reads
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "6e4c334582d5499c87bbf10fee564b75"

# Auth, checkout, stock, payouts (read-after-write)
[[hyperdrive]]
binding = "HYPERDRIVE_PRIMARY"
id = "a77fbb34c2374d1d9d6be0e65c92c177"

[[kv_namespaces]]
binding = "CATALOG_KV"
id = "4acf1fff9ad24b848248042503b016a9"

# Product/seller images. Local dev emulates R2 automatically.
# Production: `wrangler r2 bucket create alkemart-media` (once, needs login).
[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "alkemart-media"

# Workers AI — attribute extraction drafts for vendors (see
# routes/vendor/attribute-suggest.ts). Optional at runtime: the endpoint
# answers 501 when the binding is absent, so local dev and tests are unaffected.
[ai]
binding = "AI"

# Image conversion pipeline (WebP variants at upload). Optional at runtime:
# uploads fall back to original-only when the binding is absent (local dev).
[images]
binding = "IMAGES"
